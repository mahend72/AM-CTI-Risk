[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "am-assurance"
version = "1.0.0"
description = "CTI-driven cyber and AI assurance for Additive Manufacturing systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENCE.txt" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
