# Scoring configuration for the legacy-equivalent risk engine.
#
# Every value in this file is copied VERBATIM from the runtime behaviour of
# the original repository (Code/find_severity.py.txt, find_frequency.py.txt,
# find_likelihood.py.txt, find_timeliness.py.txt, Impact_level.py.txt).
# See docs/METHODOLOGY.md for the definition of each factor and
# docs/LEGACY_BEHAVIOUR.md / docs/METHODOLOGY_DECISIONS.md for the exact
# provenance of the severity table (it reflects the *actual* runtime dict
# after Python silently collapsed duplicate literal keys 34 and 10 - not the
# pre-collapse source text).
#
# Do not "clean up" or "correct" values in this file without a corresponding
# entry in docs/METHODOLOGY_DECISIONS.md and a regression test proving the
# change is intentional and its impact on existing results is understood.

# --- Severity: technique -> bucket key -> severity level ---------------
# Reproduces Code/find_severity.py.txt's `data1` exactly as it evaluates at
# runtime (13 keys; duplicate literal keys 34 and 10 already collapsed by
# Python before this table was ever transcribed here).
severity_buckets:
  10:  ["T0813"]
  24:  ["T0837"]
  34:  ["T08362", "T0879", "T0889"]      # T08362 is a malformed ID - see docs/LEGACY_BEHAVIOUR.md §2
  41:  []
  62:  ["T0816", "T0831", "T0847", "T0858", "T0879"]
  68:  ["T0800", "T0839", "T0857", "T0862", "T0881"]
  87:  ["T0806", "T0809", "T0811", "T0867", "T0874", "T0882", "T0885", "T0887"]
  101: ["T0836"]
  104: ["T0381", "T0804", "T0813", "T0831", "T0838", "T0856"]  # T0381 is a malformed ID - see docs/LEGACY_BEHAVIOUR.md §2
  105: ["T0800", "T0816", "T0830", "T0839", "T0840", "T0857", "T0867", "T0873", "T0885", "T0887"]
  115: ["T0800", "T0816", "T0830", "T0839", "T0840", "T0857", "T0867", "T0873", "T0885", "T0887"]
  130: ["T0806", "T0830", "T0839", "T0851", "T0856", "T0889"]
  141: ["T0801", "T0835", "T0842", "T0856", "T0877"]

# base_score (mean of matching bucket keys) -> severity_level.
# Lower bound inclusive (>=) on every bracket - this partition already had
# no gaps or overlaps in the legacy code (unlike impact_level - see D-4).
severity_thresholds:
  - {min: 120, level: 4}
  - {min: 80,  level: 3}
  - {min: 40,  level: 2}
  - {min: 10,  level: 1}
  - {min: -.inf, level: 0}

# --- Frequency -----------------------------------------------------------
# Entity-level frequency_value = len(entity.external_references) *
#   (mean(per-technique frequency over related techniques) + frequency_offset)
# per-technique frequency = len(attack_pattern.external_references)
frequency_offset: 1.0

frequency_thresholds:
  - {min: 60, level: 4}
  - {min: 40, level: 3}
  - {min: 20, level: 2}
  - {min: 2,  level: 1}
  - {min: -.inf, level: 0}

# --- Timeliness ------------------------------------------------------------
# like = (as_of - modified_timestamp) / 86400 / 7  (elapsed weeks)
# Implemented as 5 independent (non-elif) comparisons, in this exact order,
# to preserve the legacy overlap at like == 60 (resolves to level 0, not 1).
# See docs/LEGACY_BEHAVIOUR.md §3 / docs/METHODOLOGY_DECISIONS.md D-3.
timeliness_rules:
  - {op: "<=", value: 20, level: 4}
  - {op: "<=", value: 35, gt: 20, level: 3}
  - {op: "<=", value: 50, gt: 35, level: 2}
  - {op: "<=", value: 60, gt: 50, level: 1}
  - {op: ">=", value: 60, level: 0}

# --- Likelihood ------------------------------------------------------------
# value = timeliness_level * frequency_level
likelihood_thresholds:
  - {min: 11, level: 4, label: "Critical"}
  - {min: 7,  level: 3, label: "High"}
  - {min: 3,  level: 2, label: "Moderate"}
  - {min: 1,  level: 1, label: "Low"}
  - {min: -.inf, level: 0, label: "Unknown"}

# --- Impact ------------------------------------------------------------
# impact_score = non-zero mean of related-technique base_scores.
# CORRECTED per docs/METHODOLOGY_DECISIONS.md D-4: lower bounds made
# inclusive (>=) to remove the legacy UnboundLocalError at exactly
# 10 / 50 / 80. Verified to change zero of the 93 pre-existing results
# (none of them land on these exact boundaries).
impact_thresholds:
  - {min: 120, level: 4, label: "Very Critical"}
  - {min: 80,  level: 3, label: "Critical"}
  - {min: 50,  level: 2, label: "Hazardous"}
  - {min: 10,  level: 1, label: "Certain Hazard"}
  - {min: -.inf, level: 0, label: "Not Hazard"}
